# Tests, builds the static site (dist/) and deploys it to GitHub Pages: https://schmarante.github.io/wyrfl/
# Runs on every push to master (and by hand from the Actions tab).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions" (otherwise GitHub's own Jekyll build runs
# instead and the deploy step fails).
name: Deploy to GitHub Pages

on:
  # every push to master
  push:
    branches: ["master"]

  # manual run from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN may deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; queued runs in between are skipped, a running one is not cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the app version counts the commits (astro.config.mjs)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # tests/ is kept out of the repository (local only, `ddev npm test`) – here Vitest finds none and passes
      - name: Test
        run: npm test --if-present -- --passWithNoTests

      # project page lives in a sub directory (/wyrfl/): base path and public URL come from the Pages settings
      # (base_path "/wyrfl", base_url "https://schmarante.github.io/wyrfl") – astro.config.mjs reads both.
      # Repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables) overrides the URL,
      # e.g. for a custom domain.
      # Test keys L/P (see .env.example): repository variable PUBLIC_DEBUG=true switches them on – unset = off.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
          PUBLIC_DEBUG: ${{ vars.PUBLIC_DEBUG || 'false' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
